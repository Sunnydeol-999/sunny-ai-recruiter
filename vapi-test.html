<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Vapi Test</title>
</head>

<body>

    <h1>🎙️ Sunny Vapi Test</h1>

    <p>Click the button below to start Sunny.</p>

    <div id="vapi-button"></div>

    <script>

        var vapiInstance = null;

        const assistant = "234beb2e-9f28-46eb-958b-c021f3771d34";

        const apiKey = "b27091e2-1278-4e15-a98e-36548eff9dcc";

        const buttonConfig = {
            position: "bottom-right",
            offset: "40px",
            width: "50px",
            height: "50px",
            idle: {
                color: "#000000",
                type: "pill",
                title: "Talk to Sunny",
                subtitle: "Click to talk",
                icon: "https://unpkg.com/lucide-static@0.468.0/icons/mic.svg"
            },
            loading: {
                color: "#000000",
                type: "pill",
                title: "Connecting...",
                subtitle: "Please wait",
                icon: "https://unpkg.com/lucide-static@0.468.0/icons/loader-2.svg"
            },
            active: {
                color: "#000000",
                type: "pill",
                title: "Sunny is listening",
                subtitle: "Click to end",
                icon: "https://unpkg.com/lucide-static@0.468.0/icons/phone-off.svg"
            }
        };

        (function (d, t) {

            var g = d.createElement(t);
            var s = d.getElementsByTagName(t)[0];

            g.src =
                "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";

            g.defer = true;
            g.async = true;

            s.parentNode.insertBefore(g, s);

            g.onload = function () {

                vapiInstance = window.vapiSDK.run({
                    apiKey: apiKey,
                    assistant: assistant,
                    config: buttonConfig
                });

            };

        })(document, "script");

    </script>

</body>

</html>
